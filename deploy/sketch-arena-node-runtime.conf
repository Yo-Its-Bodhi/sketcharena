[Service]
# Drop-in for /etc/systemd/system/sketch-arena.service.d/runtime.conf.
# The node-lts symlink is owned by Sketch Arena and can be advanced only after
# the replacement archive's official checksum and release gates are verified.
ExecStart=
ExecStart=/opt/sketch-arena/runtime/node-lts/bin/node /opt/sketch-arena/current/apps/server/dist/index.js
