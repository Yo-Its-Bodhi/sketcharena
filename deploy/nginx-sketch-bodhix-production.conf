server {
    listen 443 ssl;
    server_name sketch.bodhix.io;

    ssl_certificate /etc/letsencrypt/live/sketch.bodhix.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sketch.bodhix.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/sketch-arena/current/apps/web/dist;
    index index.html;
    client_max_body_size 32m;

    location = /health/live {
        proxy_pass http://127.0.0.1:4100;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:4100;
        access_log off;
    }

    location = /metrics { deny all; }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://nftstudio.bodhix.io; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self' https://evm.shidoscan.net https://9008.rpc.thirdweb.com https://nftstudio.bodhix.io wss://sketch.bodhix.io" always;
}

server {
    listen 80;
    server_name sketch.bodhix.io;
    return 301 https://$host$request_uri;
}
