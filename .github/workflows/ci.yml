name: Release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sketch_arena_test
          POSTGRES_USER: sketch
          POSTGRES_PASSWORD: sketch-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sketch -d sketch_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sketch:sketch-ci-only@127.0.0.1:5432/sketch_arena_test
      TEST_DATABASE_URL: postgresql://sketch:sketch-ci-only@127.0.0.1:5432/sketch_arena_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run qa:load
      - run: npm audit --omit=dev --audit-level=high

  panic-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contract:compile
      - run: npm run contract:test:ci
